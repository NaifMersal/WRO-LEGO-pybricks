quarto-required: ">= 1.8.26"

# SDAIA reveal.js slide project — branding applied globally here so each deck's
# own front matter stays minimal (title / subtitle / date / format: revealjs).
# This file is scaffolded by the author-verify-slides skill (scaffold.py); keep
# it in sync with the skill's bundle/_quarto.yml when branding changes.

project:
  type: website
  output-dir: output
  render:
    - "**/*.qmd"
    - "!slides_template/*.qmd"
    - "!docs/"
  # Standalone student-facing interactives. They are hand-written .html, not .qmd,
  # so Quarto will not pick them up on its own — list them here or the decks that
  # iframe them get a broken frame in output/.
  resources:
    - interactives/beam-balance-catchup.html
    # Claw lesson downloads. programming-the-claw.qmd embeds both files for
    # offline use; these copies are what the bench build actually loads.
    - code/claw_starter.py
    - code/claw_gripper.py
    # The recap arcade, three ways. The master carries all 12 levels; the two
    # part files are GENERATED from it by tools/split-recap.py and split at
    # level 7, so each sitting keeps its own localStorage key. All three must
    # ship — Part 2 was missing from this list for the whole first cohort and
    # therefore never reached a student.
    - interactives/recap-arcade.html
    - interactives/recap-part1-days2-5.html
    - interactives/recap-part2-days5-8.html
    # 🔒 The Skills Check does NOT ship, and neither half of it may be added here.
    # build-pages.py writes BOTH pages — exam.html and its answer-key twin
    # coach.html — into docs/exam/web/, which is git-ignored and outside
    # `resources:`, so Quarto neither renders nor copies them. The exam is opened
    # from disk (or the room LAN) on the day. The page used to publish, and it
    # carried the live endpoint, the exam secret and the students' names.
    #
    # The bench simulator (tools/robot_sim/, ~5.6 MB of inlined Brython) is
    # likewise coach-side only and not distributed, so it is not listed either.
    #
    # Vendored single-page field tool + its logos and mat image. The whole
    # folder must ship, not just the .html — it loads Logo/* and GameField/*.
    - tools/odommap/**
    # The sim kit is linked by every deck's <head>; Quarto only copies assets it
    # can see referenced (the theme's SVGs), so this one must be listed or the
    # decks ship with a dead <script src> and every simulation goes quiet.
    - slides_template/assets/sim-kit.js

execute:
  echo: false
  warning: false
  message: false

format:
  revealjs:
    slide-number: c/t
    show-slide-number: all
    embed-resources: false
    preview-links: false
    # sdaia.scss is the SDAIA brand bundle (kept in sync with the
    # author-verify-slides skill); rockstars-sims.scss is this project's own
    # layer -- the shared chrome for the interactive sims in the decks.
    theme:
      - default
      - slides_template/assets/sdaia.scss
      - slides_template/assets/rockstars-sims.scss
    logo: slides_template/assets/sdaia.svg
    transition: slide
    transition-speed: default
    background-transition: fade
    title-slide-attributes:
      data-background-image: "slides_template/assets/anim.svg"
      data-background-opacity: "0.15"
      data-background-size: "cover"
    chalkboard: true
    multiplex: false
    help: true
    progress: true
    history: false
    hide-inactive-cursor: true
    strip-comments: true
    center: false
    incremental: false
    code-copy: true
    code-line-numbers: true
    scrollable: false
    pdf-separate-fragments: false
    filters:
      - slides_template/assets/splash.lua
    plugins: [menu]
    include-in-header:
      - file: slides_template/assets/favicon.html
      # The `SIM` helper kit every deck's simulations are built on. Linked rather
      # than inlined so the browser caches one copy across all 12 decks instead
      # of carrying 10 KB in each. Every deck renders to output/slides/, so the
      # relative path is the same for all of them.
      #
      # NO `defer` and NO `async`: each deck's own <script> blocks call SIM.def()
      # while the body is parsing, so the kit has to have run by then.
      - text: |
          <script src="../slides_template/assets/sim-kit.js"></script>
